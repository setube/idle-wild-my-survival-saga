name: 项目检查

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: 安装依赖
        run: bun install --frozen-lockfile
      - name: 类型检查、运行测试并构建
        run: bun run check
