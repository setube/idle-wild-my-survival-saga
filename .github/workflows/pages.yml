name: 部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建网站
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查、运行测试并构建网站
        run: bun run check

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
        with:
          static_site_generator: custom

      - name: 上传网站构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: 部署网站
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
